global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "aegis-api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-gateway:8000"]
        labels:
          service: "aegis-api-gateway"
          environment: "enterprise"

  - job_name: "aegis-ai-inference"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ai-inference:8001"]
        labels:
          service: "aegis-ai-inference"
          environment: "enterprise"
