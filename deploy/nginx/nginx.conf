# ==============================================================================
# NGINX REVERSE PROXY & STATIC EDGE GATEWAY FOR AEGIS-CCTV ENTERPRISE VMS
# Routes:
#   /             -> Static UI Dashboard (Milestone/Siemens Flat Industrial)
#   /snapshots/*  -> Static Violation Evidence JPEGs
#   /api/*, /docs -> Control-Plane FastAPI API Gateway (api-gateway:8000)
#   /video_feed   -> MJPEG Stream directly from AI Inference Node (ai-inference:8001)
#   /ws/webcam    -> Binary JPEG WebSocket to AI Inference Node (ai-inference:8001)
# ==============================================================================

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 512M;

    # Root UI Dashboard served directly by Nginx
    location = / {
        root /app/src/web/templates;
        try_files /dashboard.html =404;
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Violation Evidence Snapshots
    location /snapshots/ {
        alias /app/snapshots/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
    }

    # Control-Plane API & OpenAPI Docs -> api-gateway
    location /api/ {
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /docs {
        proxy_pass http://api-gateway:8000/docs;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api-gateway:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # High-Bandwidth MJPEG Video Feed -> ai-inference
    location = /video_feed {
        proxy_pass http://ai-inference:8001/video_feed;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # High-FPS C960 Ultra Binary WebSocket -> ai-inference
    location = /ws/webcam {
        proxy_pass http://ai-inference:8001/ws/webcam;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
